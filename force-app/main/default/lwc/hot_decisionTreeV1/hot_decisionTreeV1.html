<template>
    <lightning-card title="Beslutningstre">
        <div class="tree-container">
            <!--
                Hvert element i visibleLevels representerer
                ett nivå i beslutningstreet.
            -->
            <template for:each={visibleLevels} for:item="level">
                <div key={level.level} class={level.cssClass}>
                    <template for:each={level.options} for:item="option">
                        <!-- ================================
                             VALGBARE BOKSER
                             ================================ -->

                        <template lwc:if={option.isChoice}>
                            <div
                                key={option.id}
                                class={option.cssClass}
                                data-id={option.id}
                                data-level={level.choiceLevel}
                                onclick={handleOptionClick}
                            >
                                <span class="option-text">
                                    <span class="option-label">{option.label}</span>
                                    <template lwc:if={option.description}>
                                        <span class="option-description">
                                            {option.description}
                                            <template lwc:if={option.descriptionLinkUrl}>
                                                <a
                                                    href={option.descriptionLinkUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    onclick={handleDescriptionLinkClick}
                                                >
                                                    {option.descriptionLinkText}
                                                </a>
                                            </template>
                                        </span>
                                    </template>
                                </span>

                                <!-- Informasjonsknapp -->

                                <template lwc:if={option.infoModal}>
                                    <button
                                        class="info-button"
                                        data-modal={option.infoModal}
                                        onclick={handleInfoClick}
                                        title="Vis informasjon"
                                    >
                                        i
                                    </button>
                                </template>
                            </div>
                        </template>

                        <!-- ================================
                             INFORMASJONSBOKSER
                             ================================ -->

                        <template lwc:if={option.isInfo}>
                            <div key={option.id} class="tree-option tree-option-info">
                                <span class="option-text">
                                    <span class="option-label">{option.label}</span>
                                    <template lwc:if={option.description}>
                                        <span class="option-description">
                                            {option.description}
                                            <template lwc:if={option.descriptionLinkUrl}>
                                                <a
                                                    href={option.descriptionLinkUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    onclick={handleDescriptionLinkClick}
                                                >
                                                    {option.descriptionLinkText}
                                                </a>
                                            </template>
                                        </span>
                                    </template>
                                </span>

                                <!-- Informasjonsknapp -->

                                <template lwc:if={option.infoModal}>
                                    <button
                                        class="info-button"
                                        data-modal={option.infoModal}
                                        onclick={handleInfoClick}
                                        title="Vis informasjon"
                                    >
                                        i
                                    </button>
                                </template>
                            </div>
                        </template>

                        <!-- ================================
                             RESULTATBOKSER
                             ================================ -->

                        <template lwc:if={option.isResult}>
                            <div key={option.id} class={option.cssClass}>
                                <span class="option-text">
                                    <span class="option-label">{option.resultText}</span>
                                    <template lwc:if={option.description}>
                                        <span class="option-description">
                                            {option.description}
                                            <template lwc:if={option.descriptionLinkUrl}>
                                                <a
                                                    href={option.descriptionLinkUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    onclick={handleDescriptionLinkClick}
                                                >
                                                    {option.descriptionLinkText}
                                                </a>
                                            </template>
                                        </span>
                                    </template>
                                </span>
                            </div>
                        </template>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- =====================================================
         MODAL
         ===================================================== -->

    <template lwc:if={isModalOpen}>
        <c-hot_modal heading={modalTitle} description={modalDescription} ondismiss={closeModal}>

                     MODAL-INNHOLD

                                <td>

                <template lwc:if={isUnder18Modal}>

                        <thead>

                                <th colspan="6" scope="colgroup">Myndig bruker over 18 år</th>

                                    <p>Be om fødsels- og personnummer</p>

                            </tr>

                <template lwc:if={isForeldreForesatteVergeMindreaarigeModal}>
                    <table class="modal-info-table" aria-label="Bruker (mindreårig/ under 18 år">
                        <thead>
                            <!-- <tr>
                                <th colspan="6" scope="colgroup">Myndig bruker over 18 år</th>
                            </tr> -->
                            <tr>
                                <th scope="col">Interessent</th>
                                <th scope="col">Definisjon</th>
                                <th scope="col">Informasjonsbehov (eksempler)</th>
                                <th scope="col">Hva slags informasjon kan vi gi</th>
                                <th scope="col">Krav til fullmakt/Identifisering</th>
                                <th scope="col">Behov for samtalereferat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <p>Foreldre/ foresatte/ verge for mindreårig under 18 år.</p>
                                    <p>
                                        Husk at verge og forelder/ foresatt ikke kan ta kontakt på STO, eller i
                                        innlogget chat. Se artikkel&nbsp;
                                        <a
                                            href="https://navdialog.lightning.force.com/lightning/r/Knowledge__kav/ka0QC000001pEMvYAM/view"

                                        >
                                            Skriv til oss STO</a
                                        >.
                                    </p>
                                </td>
                                <td>
                                    <p>
                                        Verge er den eller de som har foreldreansvar for barnet etter reglene i

                                </td>
                                <td>

                                <td>

                                    </p>

                                </td>
                                <td>
                                    <p>Skriv samtalereferat i Salesforce på barnet</p>

                <template if:true={isFosterforeldreModal}>

                                <th colspan="6" scope="colgroup">Myndig bruker over 18 år</th>
                            </tr> -->

                                <th scope="col">Definisjon</th>

                                </td>
                                <td>
                                    <p>Status i sak</p>
                                    <p>Hvordan søke hjelpemiddel</p>

                                    <p>Opplysninger kan gis ut fra fullmaktens gyldighet og omfang.</p>
                                </td>

                                    <p>

                                        bekreftelse på foreldreansvar. Derfor kreves fullmakt selv om barnet er
                                        registrert på samme adresse som fosterforeldre
                                    </p>
                                    <p>
                                        Dersom fullmakt mangler, henviser du fosterforeldrene til deres saksbehandler i
                                        barnevernet for utarbeidelse av bekreftelse på at de er fosterforeldre for
                                        barnet, og hva fullmakten gjelder.
                                    </p>
                                    <p>
                                        Still sikkerhetsspørsmål med utgangspunkt i opplysningene du finner i
                                        fullmakten.
                                    </p>
                                </td>
                                <td>
                                    <p>Skriv samtalereferat i Salesforce på barnet</p>
                                    <p>
                                        Dersom du mottar opplysninger som kan ha betydning for saksbehandlingen:
                                        Journalfør samtalereferatet og opprett et forvaltningsnotat.
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </template>
                <template lwc:if={isVergeForVoksneUmyndiggjorteModal}>
                    <table class="modal-info-table" aria-label="Verge for voksne/ umyndiggjorte">
                        <thead>
                            <!-- <tr>
                                <th colspan="6" scope="colgroup">Myndig bruker over 18 år</th>
                            </tr> -->
                            <tr>
                                <th scope="col">Interessent</th>
                                <th scope="col">Definisjon</th>
                                <th scope="col">Informasjonsbehov (eksempler)</th>
                                <th scope="col">Hva slags informasjon kan vi gi</th>
                                <th scope="col">Krav til fullmakt/Identifisering</th>
                                <th scope="col">Behov for samtalereferat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <p>Verge for voksne/ umyndiggjorte.</p>

                                        innlogget chat. Se artikkel&nbsp;
                                        <a
                                            href="https://navdialog.lightning.force.com/lightning/r/Knowledge__kav/ka0QC000001pEMvYAM/view"
                                            target="_blank"
                                        >
                                            Skriv til oss STO</a
                                        >.
                                    </p>
                                </td>
                                <td>
                                    <p>
                                        Verge representerer bruker, og har rett til opplysninger som er nødvendige for å
                                        ivareta brukers interesser.
                                    </p>
                                    <p>
                                        Vergen er en medhjelper og kan ikke overstyre en bruker som ikke er fratatt
                                        rettslig handleevne.
                                    </p>
                                    <p>
                                        Brukere som er fratatt rettslig handleevne eller økonomisk rettslig handleevne
                                        skal normalt ikke ha bank-ID.
                                    </p>
                                </td>
                                <td>
                                    <p>Status i sak (eksempler):</p>
                                    <ul class="slds-list_dotted">
                                        <li>Søknad</li>
                                        <li>Bytte</li>
                                        <li>Reparasjon</li>
                                        <li>Utlevering</li>
                                        <li>Henvisning</li>
                                    </ul>
                                    <p>Hjelpemiddeloversikt</p>
                                    <p>Hvordan søke hjelpemiddel</p>
                                </td>
                                <td>
                                    <p>Du kan gi informasjon i sak ut fra vergemålets gyldighet og omfang.</p>
                                    <p>Sjekk at vergemålet omfatter hjelpemidler</p>
                                    <p>
                                        <u>Person under vergemål ønsker opplysninger i egen sak:</u> Å være under
                                        vergemål begrenser ikke adgangen til å involvere seg i sin egen sak.
                                    </p>
                                </td>
                                <td>
                                    <p>

                                    </p>

                                    </p>
                                    <p>Still identifiseringsspørsmål ut fra detaljer om vergemålets omfang.</p>
                                </td>
                                <td>
                                    <p>Samtalereferat registreres på brukeren henvendelsen gjelder</p>
                                    <p>

                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </template>
                <template lwc:if={isPaaroerendeModal}>
                    <table class="modal-info-table" aria-label="Verge for voksne/ umyndiggjorte">
                        <thead>
                            <!-- <tr>
                                <th colspan="6" scope="colgroup">Myndig bruker over 18 år</th>
                            </tr> -->
                            <tr>
                                <th scope="col">Interessent</th>
                                <th scope="col">Definisjon</th>
                                <th scope="col">Informasjonsbehov (eksempler)</th>
                                <th scope="col">Hva slags informasjon kan vi gi</th>

                                </td>
                                <td>
                                    <p>Det er bruker selv som avgjør hvem som er deres nærmeste pårørende</p>
                                    <p>
                                        Dette kan være alt fra ektefelle/ samboer eller voksne barn til en venninne fra

                                    </p>
                                    <p>

                                <td>
                                    <p>Status i sak (eksempler):</p>
                                    <ul class="slds-list_dotted">
                                        <li>Søknad</li>

                                        <li>Reparasjon</li>
                                        <li>Utlevering</li>
                                        <li>Henvisning</li>

                                    <p>Hvordan søke hjelpemiddel</p>
                                    <p>Retur av hjelpemidler ved MORS</p>
                                </td>
                                <td>
                                    <p>Fullmakt eller samtykke: Gi opplysninger ut fra de rammene fullmakten gir.</p>
                                    <p>Uten fullmakt: Vurder om henvendelsen kan løses på en annen måte</p>
                                    <p>

                                    </p>
                                    <p>Følg magefølelsen</p>
                                    <p>
                                        Jo mer detaljert vi er i informasjonen vi gir, jo større er sjansen for å gjøre

                                    </p>
                                    <p><strong>Viktig: Dokumenter alltid!</strong></p>
                                </td>
                                <td>
                                    <p>

                                    </p>

                                    </p>
                                    <p>Vårt første svar er <strong>alltid</strong> at det bør opprettes fullmakt</p>
                                    <p>
                                        Dersom det videre i samtalen er tydelig at bruker ikke er i stand til å ivareta

                                    </p>
                                </td>
                                <td>
                                    <p>Samtalereferat registreres på brukeren henvendelsen gjelder</p>
                                    <p>
                                        Dersom vi har gjort en skjønnsmessig vurdering og kommet fram til at vi kan gi

                                    </p>
                                    <p>
                                        Dersom du mottar opplysninger som kan ha betydning for saksbehandlingen:
                                        Journalfør samtalereferatet og opprett et forvaltningsnotat
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </template>
                <template lwc:if={isPersonligAssistentBPAModal}>
                    <table class="modal-info-table" aria-label="Verge for voksne/ umyndiggjorte">
                        <thead>
                            <!-- <tr>
                                <th colspan="6" scope="colgroup">Myndig bruker over 18 år</th>
                            </tr> -->
                            <tr>
                                <th scope="col">Interessent</th>
                                <th scope="col">Definisjon</th>
                                <th scope="col">Informasjonsbehov (eksempler)</th>
                                <th scope="col">Hva slags informasjon kan vi gi</th>

                                <th scope="col">Behov for samtalereferat</th>
                            </tr>
                        </thead>

                                </td>

                                    <p>

                                        og opplæring på. BPA er rettet mot personer med langvarig og stort behov for
                                        personlig assistanse. Mer informasjon finnes i brukerrettighetsloven § 2- 1 d.
                                        (Kilde: helsenorge.no)
                                    </p>

                                    <p>Status i sak</p>
                                    <p>Hvordan søke hjelpemiddel</p>

                                <td>
                                    <p>Ingen uten fullmakt</p>
                                    <p>Fullmakt eller samtykke: Gi opplysninger ut fra de rammene fullmakten gir.</p>
                                </td>
                                <td>
                                    <p>

                                        skal noteres i samtalereferat i Salesforce). Still kontrollspørsmål til bruker
                                        for å identifisere.
                                    </p>
